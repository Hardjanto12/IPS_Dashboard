<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Dashboard</title>
    <link href="assets/plus_jakarta_sans.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="assets/sweetalert2.min.js"></script>
</head>

<body>

    <div class="dashboard-container">
        <header>
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>IPS <span class="highlight">Dashboard</span></h1>
            </div>
        </header>

        <main>
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>Daftar Antrean (Task List)</h2>
                    <div class="controls" style="display: flex; gap: 1rem; align-items: center;">
                        <div class="toggle-container" style="display: flex; align-items: center; gap: 0.5rem;">
                            <label class="switch">
                                <input type="checkbox" id="auto-refresh-toggle">
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Auto
                                Refresh</span>
                        </div>
                        <!-- Status filter removed to focus only on safe data -->
                        <select id="limit-filter" class="custom-select">
                            <option value="50">50 Data</option>
                            <option value="100">100 Data</option>
                            <option value="500">500 Data</option>
                            <option value="0" selected>Semua Data</option>
                        </select>
                        <button id="refresh-btn" class="btn primary-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-8.21l-5.6 5.6" />
                            </svg>
                            Refresh
                        </button>
                        <button id="open-all-highlighted-btn" class="btn warning-btn" style="display: none; background-color: #ff3366; color: white; border: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                            Open Red Task
                        </button>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search Task ID...">
                    <button class="btn btn-outline" id="searchBtn">Search</button>
                    <div class="toggle-container" style="display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem;">
                        <label class="switch">
                            <input type="checkbox" id="highlight-no-doc-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Highlight Tanpa Dokumen</span>
                        <select id="highlight-module-select" class="custom-select" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 8px; min-width: auto;">
                            <option value="import">Import</option>
                            <option value="export">Export</option>
                        </select>
                        <span id="missing-doc-count" style="font-size: 0.85rem; color: #ff3366; font-weight: 700; background: rgba(255,51,102,0.1); padding: 2px 8px; border-radius: 10px; display: none;"></span>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-left: 15px; margin-bottom: 10px;">
                    <button class="btn primary-btn" id="massSubmitBtn" style="display: none; align-items: center; gap: 5px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Auto-Submit Selected (0)
                    </button>
                    <button class="btn warning-btn" id="massOpenBtn" style="display: none; background-color: #f59e0b; color: white; border: none; align-items: center; gap: 5px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Open Selected (0)
                    </button>
                </div>

                <div class="table-container">
                    <table id="task-table">
                        <thead>
                            <tr>
                                <th width="40"><input type="checkbox" id="selectAllCheckbox"></th>
                                <th>#</th>
                                <th class="sortable" data-sort="task_id">UUID / Task ID <span class="sort-icon"></span></th>
                                <th class="sortable" data-sort="container_no">No. Container <span class="sort-icon"></span></th>
                                <th>Tipe (Model)</th>
                                <th>State (Status)</th>
                                <th class="sortable" data-sort="create_time">Waktu Masuk <span class="sort-icon"></span></th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="task-body">
                            <!-- Tasks will be injected here via JS -->
                            <tr>
                                <td colspan="7" class="loading-state">
                                    <div class="spinner"></div>
                                    <p>Memuat data dari bpm.db...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">Task Detail</h3>
                <button id="modal-close" class="btn action-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
                <div class="spinner"></div>
                <p>Memuat detail...</p>
            </div>
        </div>
    </div>

    <script src="app.js?v=8"></script>
</body>

</html>
