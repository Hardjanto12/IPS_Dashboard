<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Integration Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="dashboard-container">
        <header>
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>Integrasi IPS <span class="highlight">Dashboard</span></h1>
            </div>
            <div class="header-status">
                <span class="status-indicator"></span>
                <span id="connection-status">Live Polling</span>
            </div>
        </header>

        <main>
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>Daftar Antrean (Task List)</h2>
                    <div class="controls" style="display: flex; gap: 1rem; align-items: center;">
                        <div class="toggle-container" style="display: flex; align-items: center; gap: 0.5rem;">
                            <label class="switch">
                                <input type="checkbox" id="auto-refresh-toggle" checked>
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 0.9rem; color: var(--text-secondary);">Auto Refresh</span>
                        </div>
                        <select id="status-filter" class="custom-select">
                            <option value="all" selected>Semua Status</option>
                            <option value="check.ready">🖥️ Di Layar IPS</option>
                            <option value="datasend.ready">📤 Proses Kirim</option>
                            <option value="datasend.end">✅ Terkirim</option>
                            <option value="preCheck.ready">⏳ Pre-Check</option>
                            <option value="preCheck.failed">❌ Pre-Check Gagal</option>
                        </select>
                        <select id="limit-filter" class="custom-select">
                            <option value="50">50 Data</option>
                            <option value="100" selected>100 Data</option>
                            <option value="500">500 Data</option>
                            <option value="0">Semua Data</option>
                        </select>
                        <button id="refresh-btn" class="btn primary-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-8.21l-5.6 5.6"/></svg>
                            Refresh Manual
                        </button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="task-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>UUID / Task ID</th>
                                <th>Tipe (Model)</th>
                                <th>State (Status)</th>
                                <th>Waktu Masuk</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="task-body">
                            <!-- Tasks will be injected here via JS -->
                            <tr>
                                <td colspan="6" class="loading-state">
                                    <div class="spinner"></div>
                                    <p>Memuat data dari bpm.db...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">Task Detail</h3>
                <button id="modal-close" class="btn action-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
                <div class="spinner"></div>
                <p>Memuat detail...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
