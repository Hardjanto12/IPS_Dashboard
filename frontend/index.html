<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/sweetalert2.min.js"></script>
</head>

<body>

    <div class="dashboard-container">
        <header>
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>IPS Dashboard</h1>
                <div id="health-indicator" style="width: 12px; height: 12px; border-radius: 50%; background-color: var(--hairline); cursor: help;" aria-label="Checking system health…"></div>
            </div>
        </header>

        <main>
            <div class="panel">
                <div class="panel-header">
                    <h2>Task List</h2>
                    <div class="controls" style="display: flex; gap: 16px; align-items: center;">
                        <div class="toggle-container" style="display: flex; align-items: center; gap: 8px;">
                            <label class="switch">
                                <input type="checkbox" id="auto-refresh-toggle" aria-label="Auto Refresh">
                                <span class="slider round"></span>
                            </label>
                            <span style="font-size: 14px; color: var(--ink-muted); font-weight: 500;">Auto Refresh</span>
                        </div>
                        <select id="limit-filter" class="custom-select" aria-label="Data limit filter">
                            <option value="50">50 Data</option>
                            <option value="100">100 Data</option>
                            <option value="500">500 Data</option>
                            <option value="0" selected>Semua Data</option>
                        </select>
                        <button id="refresh-btn" class="btn primary-btn">
                            Refresh
                        </button>
                        <button id="open-all-highlighted-btn" class="btn warning-btn" style="display: none;">
                            Open Red Task
                        </button>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search Task ID (e.g. AXEU…)…">
                    <button class="btn" id="searchBtn">Search</button>
                    <div class="toggle-container" style="display: flex; align-items: center; gap: 8px; margin-left: 16px;">
                        <label class="switch">
                            <input type="checkbox" id="highlight-no-doc-toggle" aria-label="Highlight Missing Document">
                            <span class="slider round"></span>
                        </label>
                        <span style="font-size: 14px; color: var(--ink-muted); font-weight: 500;">Highlight Missing Doc</span>
                        <select id="highlight-module-select" class="custom-select" style="min-width: auto;" aria-label="Highlight module select">
                            <option value="import">Import</option>
                            <option value="export">Export</option>
                        </select>
                        <span id="missing-doc-count" style="font-size: 12px; color: var(--accent-orange); font-weight: 600; display: none; padding: 2px 6px; background: rgba(221,91,0,0.1); border-radius: 9999px;"></span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <button class="btn primary-btn" id="massSubmitBtn" style="display: none;">
                        Auto-Submit Selected (0)
                    </button>
                    <button class="btn warning-btn" id="massOpenBtn" style="display: none;">
                        Open Selected (0)
                    </button>
                </div>

                <div class="table-container">
                    <table id="task-table">
                        <thead>
                            <tr>
                                <th width="40"><input type="checkbox" id="selectAllCheckbox" aria-label="Select all tasks"></th>
                                <th>#</th>
                                <th>Thumbnail</th>
                                <th class="sortable" data-sort="task_id">Task ID <span class="sort-icon"></span></th>
                                <th class="sortable" data-sort="container_no">Container No <span class="sort-icon"></span></th>
                                <th>Model</th>
                                <th>State</th>
                                <th class="sortable" data-sort="create_time">Time <span class="sort-icon"></span></th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="task-body">
                            <tr>
                                <td colspan="9" class="loading-state" style="text-align: center; padding: 32px;">
                                    <div class="spinner"></div>
                                    <p style="margin-top: 16px; color: var(--ink-muted); font-size: 14px;">Memuat data…</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Task Detail</h3>
                <button id="modal-close" class="btn action-btn" onclick="closeModal()" aria-label="Close detail modal">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
                <div class="spinner"></div>
                <p style="text-align: center; color: var(--ink-muted); font-size: 14px;">Memuat detail…</p>
            </div>
        </div>
    </div>

    <script src="app.js?v=9"></script>
</body>

</html>
