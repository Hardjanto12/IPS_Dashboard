<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Page - Nuctech Dashboard</title>
    <link href="assets/material_symbols.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="assets/sweetalert2.min.js"></script>
    <style>
        .inspection-container {
            display: grid;
            grid-template-columns: 45% 55%;
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            padding: 24px;
            height: calc(100vh - 80px);
        }
        
        /* Left Column (Forms) */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .left-panel::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .left-panel::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

        .section-box {
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            /* Soft level 1 shadow */
            box-shadow: 0 0.175px 1.041px rgba(0,0,0,0.01),
                        0 0.8px 2.925px rgba(0,0,0,0.02),
                        0 2.025px 7.847px rgba(0,0,0,0.027),
                        0 4px 18px rgba(0,0,0,0.04);
        }
        
        .section-title {
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.125px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--hairline);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 8px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            color: var(--ink-faint);
            font-size: 12px;
            font-weight: 600;
        }
        
        .form-group input, .form-group textarea {
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--ink);
            font-family: var(--font-family);
            font-size: 15px;
            width: 100%;
            transition: all 0.2s ease;
        }
        
        .form-group input:focus-visible, .form-group textarea:focus-visible {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-group input:read-only {
            background: var(--canvas-soft);
            color: var(--ink-muted);
            cursor: default;
        }
        
        #inp-container-no {
            font-family: monospace;
            font-weight: bold;
            color: var(--ink);
            font-size: 16px;
            background: var(--canvas-soft);
            border-color: var(--primary);
        }
        
        /* Conclusion Box */
        .conclusion-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 8px;
        }
        
        .radio-group {
            display: flex;
            gap: 32px;
            background: var(--canvas-soft);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--hairline);
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }
        
        .radio-label input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }
        
        /* Right Column (Image Viewer & Carousel) */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .main-image-viewer {
            flex: 1;
            min-height: 0;
            background: var(--canvas-soft);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .main-image-viewer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .main-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: var(--surface);
            color: var(--ink);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--hairline);
        }

        .carousel-container {
            height: 120px;
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .carousel-container::-webkit-scrollbar { height: 6px; }
        .carousel-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
        .carousel-container::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

        .thumbnail {
            position: relative;
            flex: 0 0 140px;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            background-color: var(--canvas-soft);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .thumbnail.active {
            border-color: var(--primary);
            opacity: 1;
        }

        .thumbnail:hover {
            opacity: 1;
        }

        .thumb-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: var(--surface);
            color: var(--ink);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid var(--hairline);
        }
        
        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--hairline);
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="material-symbols-outlined" style="color: var(--ink);" aria-hidden="true">fact_check</span>
            <h2 style="font-size: 16px; font-weight: 600; color: var(--ink);">Check Container Data</h2>
            <div style="background: var(--canvas-soft); color: var(--ink-muted); padding: 4px 12px; border-radius: 4px; font-family: monospace; font-size: 14px; font-weight: 600; border: 1px solid var(--hairline);" id="task-id-badge">Loading…</div>
        </div>
        <div style="display: flex; gap: 16px;">
            <button class="btn action-btn" onclick="window.close()">
                <span class="material-symbols-outlined" style="font-size: 18px;" aria-hidden="true">close</span> Exit
            </button>
            <button class="btn primary-btn" id="btn-save-submit" onclick="submitInspection()">
                <span class="material-symbols-outlined" style="font-size: 18px;" aria-hidden="true">save</span> Save & Submit
            </button>
        </div>
    </div>

    <div class="inspection-container">
        <!-- Left Column: Forms -->
        <div class="left-panel">
            <div class="section-box">
                <div class="section-title">Manifest Information</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inp-front-vehicle">Front Vehicle NO.:</label>
                        <input type="text" id="inp-front-vehicle">
                    </div>
                    <div class="form-group">
                        <label for="inp-container-no">Container NO.:</label>
                        <input type="text" id="inp-container-no" placeholder="AXEU6032820">
                    </div>
                    
                    <div class="form-group">
                        <label for="inp-rear-vehicle">Rear Vehicle NO.:</label>
                        <input type="text" id="inp-rear-vehicle">
                    </div>
                    <div class="form-group">
                        <label for="inp-country">Country of Origin:</label>
                        <input type="text" id="inp-country">
                    </div>

                    <div class="form-group">
                        <label for="inp-driver">Driver's Name:</label>
                        <input type="text" id="inp-driver">
                    </div>
                    <div class="form-group">
                        <label for="inp-scan-time">Scan Time:</label>
                        <input type="text" id="inp-scan-time" readonly>
                    </div>

                    <div class="form-group">
                        <label for="inp-enter-time">Vehicle Enter Time:</label>
                        <input type="text" id="inp-enter-time" readonly>
                    </div>
                    <div class="form-group">
                        <label for="inp-exit-time">Vehicle Exit Time:</label>
                        <input type="text" id="inp-exit-time" readonly>
                    </div>

                    <div class="form-group">
                        <label for="inp-weight">Loadometer Weight:</label>
                        <input type="text" id="inp-weight">
                    </div>
                    <div></div>

                    <div class="form-group full-width">
                        <label for="inp-remark">Remark:</label>
                        <textarea id="inp-remark" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <div class="section-title">Check Conclusion</div>
                <div class="conclusion-box">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="conclusion" value="No Suspect" checked> Pass (No Suspect)
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="conclusion" value="Manual Control"> Manual Control
                        </label>
                    </div>

                    <div class="form-group full-width">
                        <label for="inp-contents">Contents (Notes):</label>
                        <textarea id="inp-contents" rows="4"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Image Carousel -->
        <div class="right-panel">
            <div class="main-image-viewer">
                <span class="main-badge" id="main-img-badge">No Image</span>
                <img id="main-image-display" src="" style="display: none;" width="800" height="600" alt="Container inspection x-ray view">
                <div id="main-image-loading" class="spinner" style="display: none;"></div>
            </div>
            
            <div class="carousel-container" id="carousel-container">
                <div style="width: 100%; text-align: center; line-height: 100px; color: var(--ink-faint);">
                    Memuat Galeri…
                </div>
            </div>
        </div>
    </div>

    <script src="inspection.js?v=4"></script>
</body>
</html>
